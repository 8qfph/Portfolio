<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yhZach — Minecraft Plugin Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface-2: #191922;
    --violet: #a855f7;
    --cyan: #22d3ee;
    --text: #e9e9f0;
    --muted: #8b8b9a;
    --online: #4ade80;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow-x:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 32px 20px;
    position:relative;
  }

  /* ambient glow field */
  .glow{
    position:fixed;
    border-radius:50%;
    filter: blur(90px);
    opacity:0.35;
    pointer-events:none;
    z-index:0;
    will-change: transform;
  }
  .glow-1{
    width:480px; height:480px;
    background: var(--violet);
    top:-10%; left:-10%;
    animation: drift1 16s ease-in-out infinite;
  }
  .glow-2{
    width:420px; height:420px;
    background: var(--cyan);
    bottom:-15%; right:-10%;
    animation: drift2 20s ease-in-out infinite;
  }
  @keyframes drift1{
    0%,100%{ transform: translate(0,0); }
    50%{ transform: translate(60px, 40px); }
  }
  @keyframes drift2{
    0%,100%{ transform: translate(0,0); }
    50%{ transform: translate(-50px, -30px); }
  }

  @media (prefers-reduced-motion: reduce){
    .glow-1, .glow-2 { animation: none; }
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 40px 32px 32px;
    text-align:center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: rise 0.7s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(18px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .avatar-wrap{
    position:relative;
    width:96px; height:96px;
    margin: 0 auto 20px;
  }
  .avatar-ring{
    position:absolute;
    inset:-4px;
    border-radius: 26px;
    background: conic-gradient(from 0deg, var(--violet), var(--cyan), var(--violet));
    animation: spin 5s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .avatar-ring{ animation:none; } }

  .avatar{
    position:absolute;
    inset:3px;
    border-radius: 22px;
    background: #1b1b26;
    overflow:hidden;
  }
  .avatar img{
    width:100%;
    height:100%;
    object-fit: cover;
    display:block;
  }

  .status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size: 11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--online);
    background: rgba(74,222,128,0.1);
    border: 1px solid rgba(74,222,128,0.25);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .ping{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--online);
    position:relative;
  }
  .ping::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:50%;
    background: var(--online);
    animation: ping 1.6s cubic-bezier(0,0,0.2,1) infinite;
  }
  @keyframes ping{
    0%{ transform:scale(1); opacity:0.7; }
    100%{ transform:scale(2.8); opacity:0; }
  }

  .name{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700;
    font-size: 26px;
    letter-spacing: 0.01em;
    background: linear-gradient(90deg, #fff, var(--cyan));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .role{
    margin-top:6px;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform:uppercase;
    color: var(--muted);
    font-weight:500;
  }

  .tagline{
    margin: 18px 0 28px;
    font-size: 14px;
    line-height:1.6;
    color: var(--muted);
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color: var(--text);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 14px;
    font-weight:500;
    text-align:left;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .link:hover{
    transform: translateY(-2px);
    border-color: var(--violet);
    background: rgba(168,85,247,0.08);
  }
  .link:focus-visible{
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }

  .icon{
    width:34px; height:34px;
    flex-shrink:0;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(255,255,255,0.05);
  }
  .icon svg{ width:18px; height:18px; }

  .link-text{ display:flex; flex-direction:column; gap:1px; }
  .link-label{ font-weight:600; }
  .link-sub{ font-size:11px; color: var(--muted); }

  .footer{
    margin-top: 26px;
    font-size: 11px;
    color: #55555f;
    letter-spacing: 0.04em;
  }
</style>
</head>
